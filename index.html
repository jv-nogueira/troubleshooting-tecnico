<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico de equipamentos</title>
  <style>
    :root {
      --ink: #17211b;
      --muted: #647168;
      --paper: #f6f7f2;
      --panel: #ffffff;
      --line: #dce3dc;
      --accent: #176b52;
      --accent-dark: #0d4938;
      --accent-soft: #e2f0e9;
      --warning: #9b5c16;
      --shadow: 0 18px 50px rgba(23, 33, 27, .09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0 0 auto;
      height: 9px;
      background: var(--accent);
      z-index: 2;
    }
    .shell { width: min(1080px, calc(100% - 36px)); margin: 0 auto; padding: 54px 0 48px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 30px; }
    .home-button { color: inherit; text-align: left; background: transparent; border: 0; padding: 0; }
    .home-button:hover h1, .home-button:focus-visible h1 { color: var(--accent); }
    .home-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; }
    .kicker { color: var(--accent); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 0; font-size: clamp(2.2rem, 5vw, 4.3rem); line-height: .96; font-weight: 400; max-width: 650px; }
    .intro { color: var(--muted); font: 15px/1.5 Arial, sans-serif; max-width: 300px; margin: 0; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
    .main-panel, aside { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .main-panel { padding: clamp(24px, 5vw, 52px); min-height: 480px; }
    h2 { font-size: clamp(1.7rem, 3.5vw, 2.75rem); line-height: 1.12; font-weight: 400; margin: 12px 0 30px; }
    .choices { display: grid; gap: 11px; max-width: 650px; }
    button { font: inherit; cursor: pointer; }
    .choice { display: flex; align-items: center; justify-content: space-between; gap: 20px; width: 100%; text-align: left; padding: 17px 18px; color: var(--ink); background: #fbfcfa; border: 1px solid var(--line); transition: border-color .18s, background .18s, transform .18s; }
    .choice:hover, .choice:focus-visible { background: var(--accent-soft); border-color: var(--accent); transform: translateX(4px); outline: none; }
    .arrow { color: var(--accent); font: 20px Arial, sans-serif; }
    .empty { color: var(--muted); font: 15px/1.5 Arial, sans-serif; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); }
    .toolbar[hidden] { display: none; }
    .back, .download { border: 0; padding: 11px 14px; font: 700 12px Arial, sans-serif; }
    .back { color: var(--ink); background: transparent; padding-left: 0; }
    .back:disabled { color: #b4beb7; cursor: not-allowed; }
    .download { color: white; background: var(--accent); }
    .download:hover, .download:focus-visible { background: var(--accent-dark); outline: none; }
    aside { padding: 24px; }
    aside h3 { margin: 0 0 18px; font-size: 18px; font-weight: 400; }
    .trail { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .trail li { display: grid; grid-template-columns: 22px 1fr; gap: 9px; color: var(--muted); font: 12px/1.4 Arial, sans-serif; }
    .trail li::before { content: counter(item); counter-increment: item; color: var(--accent); font-weight: 700; }
    .trail { counter-reset: item; }
    .trail .current { color: var(--ink); font-weight: 700; }
    .trail-empty { color: var(--muted); font: 12px/1.4 Arial, sans-serif; }
    .error { color: #8d2525; background: #fff1ef; border: 1px solid #efc9c4; padding: 15px; font: 14px/1.5 Arial, sans-serif; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 640px); padding-top: 38px; }
      header { display: block; }
      .intro { margin-top: 16px; max-width: none; }
      .workspace { grid-template-columns: 1fr; }
      aside { order: -1; }
      .main-panel { min-height: 0; padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <button class="home-button" id="home-button" type="button" aria-label="Voltar ao início">
        <div class="kicker">Troubleshooting · IT</div><h1>Diagnóstico de equipamentos</h1>
      </button>
    </header>
    <div class="workspace">
      <section class="main-panel" aria-live="polite">
        <div id="step-content"><p class="empty">Buscando dados da planilha publicada.</p></div>
        <div class="toolbar" id="toolbar" hidden>
          <button class="back" id="back-button" type="button" disabled>← Voltar</button>
          <button class="download" id="download-button" type="button">↓ Baixar log</button>
        </div>
      </section>
    </div>
  </main>
  <script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRSUlhCmw7cvlmm9uz9OviQTLXHNnOl8dw1q7frP2TGDPqOe4i3MFhyD7MqoSFTqf0mRVqkUwZn1gvW/pub?gid=0&single=true&output=csv';
    const state = { nodes: new Map(), currentId: null, history: [], log: [] };
    const content = document.getElementById('step-content');
    const toolbar = document.getElementById('toolbar');
    const backButton = document.getElementById('back-button');
    const downloadButton = document.getElementById('download-button');
    const homeButton = document.getElementById('home-button');
    let rootId = null;

    function parseCsv(text) {
      const rows = [], row = [];
      let value = '', quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const character = text[index], next = text[index + 1];
        if (character === '"' && quoted && next === '"') { value += '"'; index += 1; }
        else if (character === '"') quoted = !quoted;
        else if (character === ',' && !quoted) { row.push(value); value = ''; }
        else if ((character === '\n' || character === '\r') && !quoted) {
          if (character === '\r' && next === '\n') index += 1;
          row.push(value); if (row.some(cell => cell.trim())) rows.push(row.splice(0)); value = '';
        } else value += character;
      }
      row.push(value); if (row.some(cell => cell.trim())) rows.push(row);
      const headers = rows.shift().map(header => header.trim().toLowerCase());
      return rows.map(cells => Object.fromEntries(headers.map((header, index) => [header, (cells[index] || '').trim()])));
    }

    function safeLabel(value) {
      return value.replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character])).replace(/&lt;br\s*\/?&gt;/gi, '<br>');
    }

    function targetId(node, answer) { return (node[answer] || '').trim(); }
    function getRootNodes() { return [...state.nodes.values()].filter(node => !node.pai); }
    function getChoices(node) {
      const choices = [];
      [...state.nodes.values()].filter(child => child.pai === node.id).forEach(child => choices.push({ answer: 'next', id: child.id }));
      [...state.nodes.values()].forEach(child => {
        if (child.sim === node.id) choices.push({ answer: 'sim', id: child.id });
        if (child.nao === node.id) choices.push({ answer: 'nao', id: child.id });
      });
      return choices;
    }

    function getNextNode(id) {
      let node = state.nodes.get(String(id));
      const visited = new Set();
      while (node && !node.sim && !node.nao) {
        const child = [...state.nodes.values()].find(candidate => candidate.pai === node.id);
        if (!child || visited.has(child.id)) break;
        visited.add(node.id);
        node = child;
      }
      return node;
    }

    function renderNode(id, fromAnswer) {
      const node = state.nodes.get(String(id));
      if (!node) { content.innerHTML = '<p class="error">Este passo aponta para um registro que não existe na planilha.</p>'; return; }
      state.currentId = String(id);
      const choices = getChoices(node).filter(item => state.nodes.has(item.id));
      content.innerHTML = `<h2>${safeLabel(node.label)}</h2><div class="choices">${choices.map(choice => `<button class="choice" data-id="${safeLabel(choice.id)}" data-answer="${choice.answer}" type="button"><span>${choice.answer === 'sim' ? 'Sim' : choice.answer === 'nao' ? 'Não' : safeLabel(state.nodes.get(choice.id).label)}</span><span class="arrow">→</span></button>`).join('') || '<p class="empty">Fim deste roteiro.</p>'}</div>`;
      content.querySelectorAll('.choice').forEach(button => button.addEventListener('click', () => {
        state.history.push(state.currentId);
        const answer = button.dataset.answer === 'sim' ? 'Sim' : button.dataset.answer === 'nao' ? 'Não' : state.nodes.get(button.dataset.id).label;
        const nextNode = getNextNode(button.dataset.id);
        state.log.push({ question: node.label, answer });
        renderNode(nextNode.id, false);
      }));
      backButton.disabled = state.history.length === 0;
      toolbar.hidden = state.log.length === 0;
    }

    homeButton.addEventListener('click', () => {
      state.currentId = rootId;
      state.history = [];
      state.log = [];
      renderNode(rootId, false);
    });
    backButton.addEventListener('click', () => { const previous = state.history.pop(); if (previous) { state.log.pop(); renderNode(previous, false); } });
    downloadButton.addEventListener('click', () => {
      const cleanCell = value => String(value).replace(/[\t\r\n]+/g, ' ');
      const lines = [['Data', 'Pergunta', 'Resposta'], ...state.log.map(entry => [new Date().toLocaleString('pt-BR'), entry.question, entry.answer])];
      const text = '\ufeff' + lines.map(line => line.map(cleanCell).join('\t')).join('\r\n');
      const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })); link.download = `diagnostico-${new Date().toISOString().slice(0, 10)}.txt`; link.hidden = true; document.body.appendChild(link); link.click(); setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 1000);
    });

    fetch(csvUrl).then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.text(); }).then(text => {
      const rows = parseCsv(text);
      if (!rows.length || !['id', 'label', 'pai', 'sim', 'nao'].every(field => field in rows[0])) throw new Error('A planilha não possui as colunas esperadas.');
      rows.forEach(node => state.nodes.set(node.id, node));
      const root = rows.find(node => node.id === '1') || rows.find(node => !node.pai);
      if (!root) throw new Error('Não foi encontrada uma etapa inicial.');
      rootId = root.id;
      renderNode(root.id, false);
    }).catch(error => {
      content.innerHTML = `<p class="error">${safeLabel(error.message)}<br><br>Confirme se a planilha está publicada na web e se o navegador permite o carregamento do CSV.</p>`;
    });
  </script>
</body>
</html>
